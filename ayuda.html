<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de Código para WhatsApp</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    input, textarea {
      width: 80%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
    }
    textarea {
      height: 80px;
      resize: none;
    }
    button {
      padding: 12px 20px;
      margin-top: 15px;
      background: #25D366;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #128C7E;
    }
  </style>
</head>
<body>
  <h2>Generar Código del Álbum y Enviar por WhatsApp</h2>

  <!-- Inputs para personalizar -->
  <input type="text" id="foto" placeholder="Link de la foto del álbum/canción">
  <input type="text" id="titulo" placeholder="Nombre del álbum o canción">
  <textarea id="descripcion" placeholder="Descripción del álbum"></textarea>

  <input type="text" id="soundcloud" placeholder="Link de SoundCloud">
  <input type="text" id="spotify" placeholder="Link de Spotify">
  <input type="text" id="apple" placeholder="Link de Apple Music">
  <input type="text" id="youtube" placeholder="Link de YouTube Music">
  <input type="text" id="audiomack" placeholder="Link de Audiomack">

  <button onclick="enviarWhatsApp()">Generar y Enviar</button>

  <script>
    function enviarWhatsApp() {
      const foto = document.getElementById('foto').value;
      const titulo = document.getElementById('titulo').value;
      const descripcion = document.getElementById('descripcion').value;

      const soundcloud = document.getElementById('soundcloud').value;
      const spotify = document.getElementById('spotify').value;
      const apple = document.getElementById('apple').value;
      const youtube = document.getElementById('youtube').value;
      const audiomack = document.getElementById('audiomack').value;

      const codigo = `
<div class="album">
  <img src="${foto}">
  <div class="album-info">
    <h3>${titulo}</h3>
    <p>${descripcion}</p>
    <div class="botones">
      <a href="${soundcloud}" target="_blank" class="btn soundcloud">
        <img src="https://cdn-icons-png.flaticon.com/512/145/145809.png"> SoundCloud
      </a>
      <a href="${spotify}" target="_blank" class="btn spotify">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Spotify_logo_without_text.svg/250px-Spotify_logo_without_text.svg.png"> Spotify
      </a>
      <a href="${apple}" target="_blank" class="btn apple">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSwLts3sFLUMxJ09VW_4A8ncpIAlbd-8BPOAQ&s"> Apple Music
      </a>
      <a href="${youtube}" target="_blank" class="btn youtube">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" style="height:14px"> YouTube
      </a>
      <a href="${audiomack}" target="_blank" class="btn audiomack">
        <img src="https://crystalpng.com/wp-content/uploads/2025/03/audiomack_logo.png"> Audiomack
      </a>
    </div>
  </div>
</div>`;

      // Codificar el mensaje para WhatsApp
      const mensaje = encodeURIComponent(codigo);

      // Número de destino
      const numero = "56954998792";

      // URL de WhatsApp
      const url = `https://wa.me/${numero}?text=${mensaje}`;

      // Abrir WhatsApp
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
