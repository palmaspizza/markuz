<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verdulería NORMITE | Delivery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0b3d2e; --accent: #22c55e; --success: #16a34a;
      --danger: #e11d48; --bg: #f0fdf4; --border: #bbf7d0;
    }

    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); margin: 0; padding-top: 180px; }

    .header-fixed { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: var(--primary); color: white; }
    .nav-top { display: flex; justify-content: space-between; padding: 15px 5%; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 900; color: white; text-decoration: none; }
    .logo span { color: var(--accent); }
    .nav-icons { display: flex; gap: 20px; }
    .icon-btn { background: none; border: none; color: white; font-size: 1.4rem; cursor: pointer; position: relative; }
    .badge { position: absolute; top: -5px; right: -8px; background: var(--danger); font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; }

    .top-bar { max-width: 1200px; margin: 0 auto; padding: 10px 20px 15px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: #020617; }
    .search-input { flex: 1 1 220px; padding: 8px 10px; border-radius: 999px; border: 1px solid #1e293b; font-size: 0.85rem; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-btn { padding: 6px 12px; border-radius: 999px; border: 1px solid #1e293b; background: transparent; color: #e2e8f0; font-size: 0.75rem; cursor: pointer; }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

    .gallery-wrap { background: linear-gradient(90deg, #052e1f, #064e3b); padding: 10px 20px 20px 20px; }
    .gallery { max-width: 1200px; margin: 0 auto; display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .gallery-item { position: relative; flex: 0 0 auto; width: 180px; height: 120px; border-radius: 10px; overflow: hidden; border: 1px solid #1e293b; background: #0f172a; display: flex; align-items: center; justify-content: center; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-delete { position: absolute; top: 5px; right: 5px; width: 24px; height: 24px; border-radius: 999px; border: none; background: var(--danger); color: white; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    #loader { position: fixed; inset: 0; background: #052e1f; display: flex; align-items: center; justify-content: center; z-index: 3000; flex-direction: column; color: #dcfce7; }
    .loader-cart { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #1e293b; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .loader-cart svg { width: 80px; height: 80px; animation: spin-cart 1.5s linear infinite; }
    .loader-text { font-size: 0.9rem; opacity: 0.8; letter-spacing: 0.08em; text-transform: uppercase; }

    @keyframes spin-cart {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .flying-cart { position: fixed; z-index: 2500; pointer-events: none; font-size: 1.4rem; }

    .cart-header { background: var(--accent); color: white; padding: 20px; border-radius: 12px 12px 0 0; text-align: center; margin: -30px -30px 20px -30px; }
    .cart-item { display: grid; grid-template-columns: 80px 1fr 120px; gap: 15px; padding: 15px 0; border-bottom: 1px solid #eee; align-items: center; }
    .cart-img-min { width: 70px; height: 70px; object-fit: contain; border: 1px solid #eee; border-radius: 8px; }
    .qty-controls { display: flex; align-items: center; gap: 8px; background: #f1f5f9; padding: 5px; border-radius: 8px; }
    .btn-qty { width: 25px; height: 25px; border: none; background: var(--primary); color: white; border-radius: 4px; cursor: pointer; }
    .qty-input { width: 40px; text-align: center; border: none; background: transparent; font-weight: bold; }
    .btn-delete-item { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 0.8rem; text-decoration: underline; margin-top: 5px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .full-width { grid-column: span 2; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
    label { font-size: 0.75rem; font-weight: bold; color: var(--primary); text-transform: uppercase; }

    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
    .card { background: white; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; position: relative; transition: 0.3s; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    .card-img { height: 220px; padding: 20px; display: flex; align-items: center; justify-content: center; background: white; }
    .card-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .card-info { padding: 20px; }
    .specs-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: 0.7rem; color: #475569; margin-bottom: 10px; }
    .specs-label { font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.65rem; color: #94a3b8; }
    .specs-value { font-weight: 600; color: #0f172a; }
    .specs-select { width: 100%; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.7rem; background: white; }
    .option-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .option-btn { padding: 4px 8px; border-radius: 999px; border: 1px solid #cbd5e1; font-size: 0.7rem; background: #f8fafc; cursor: pointer; }
    .option-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    .carousel-bar { display: flex; gap: 8px; overflow-x: auto; padding: 6px 0; }
    .carousel-btn { flex: 0 0 auto; padding: 6px 12px; border-radius: 999px; border: 1px solid #cbd5e1; background: #f8fafc; cursor: pointer; }
    .carousel-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .section-toggle { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px dashed #94a3b8; background: #f1f5f9; cursor: pointer; font-weight: 700; color: #0f172a; }
    .card-delete-x { position: absolute; top: 10px; left: 10px; width: 28px; height: 28px; border-radius: 999px; border: none; background: var(--danger); color: white; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .stock-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; margin-bottom: 8px; }
    .stock-badge-ok { background: #dcfce7; color: #166534; }
    .stock-badge-low { background: #fef9c3; color: #854d0e; }
    .stock-badge-out { background: #fee2e2; color: #b91c1c; }
    .stock-dot { width: 8px; height: 8px; border-radius: 999px; background: currentColor; }
    .btn-add { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-add[disabled] { cursor: not-allowed; background: #cbd5e1; color: #64748b; }

    /* --- ANIMACIONES --- */
    #happy-cart { position: fixed; bottom: -150px; left: 50%; transform: translateX(-50%); z-index: 3000; transition: 0.5s; }
    #happy-cart.active { bottom: 30px; }
    .badge-anim { animation: bounce 1.5s; }
    @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.6); background: var(--success); } }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .modal-content { background: white; padding: 30px; border-radius: 16px; width: 95%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
.option-group {
  margin: 12px 0;
}

.option-group span {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
  color: #fff;
}

.option-btn {
  margin: 4px;
  padding: 8px 14px;
  border: 2px solid #000;
  border-radius: 6px;
  background-color: #222;
  color: #fff;
  cursor: pointer;
  transition: all 0.2s ease;
}

.option-btn:hover {
  background-color: #c00; /* rojo hover */
  border-color: #c00;
}

.option-btn.active {
  background-color: #0a3; /* verde oscuro activo */
  border-color: #0a3;
  color: #fff;
}  </style>
</head>

    <div class="modal-content">
      <div class="cart-header">
        <h2 style="margin:0">🥬 MI CANASTA</h2>
        <p style="margin:5px 0 0 0; opacity:0.8">Revisa tu pedido antes de enviar</p>
      </div>
      <div id="cartList"></div>
      <div style="margin-top: 20px; padding: 20px; background: #f8fafc; border-radius: 12px; display:flex; flex-direction:column; gap:12px">
        <div style="display:flex; gap:10px; flex-wrap:wrap">
          <div style="flex:1 1 200px">
            <label>Forma de pago</label>
            <select id="payMethod">
              <option value="">Seleccionar</option>
              <option value="transferencia">Transferencia</option>

          <span>TOTAL:</span><span id="cartTotal" style="color:var(--accent)">$0</span>
        </div>
        <button id="whatsappBtn" class="btn-add" style="background:#25d366; margin-top:15px;" onclick="enviarWhatsApp()" disabled>
          <i class="fab fa-whatsapp"></i> ENVIAR POR WHATSAPP
        </button>
        <button class="btn-add" style="background:#64748b; margin-top:10px;" onclick="cerrarModal('modalCarrito')">SEGUIR COMPRANDO</button>

  <div class="modal" id="modalProd">
    <div class="modal-content">

      <input type="hidden" id="pId">
      <div class="form-grid">
        <div class="full-width">
          <label>Nombre del Producto</label>
          <input type="text" id="pNom" placeholder="Ej: Taladro Percutor 13mm">

        <div>

            <option>Frutas</option><option>Verduras</option>
            <option>Hierbas</option><option>Orgánico</option><option>Combos</option>
          </select>
        </div>
 <div>

  <input type="number" id="pPre">
</div>
<div>

  <input type="number" id="pPreKg" step="0.01">
</div>

  <label>Precio unitario (copia automática)</label>
  <input type="number" id="pPreUni" step="0.01">
</div>

<script>
  const pPre = document.getElementById("pPre");
  const pPreUni = document.getElementById("pPreUni");

  // cada vez que se escribe en pPre, se actualiza pPreUni
  pPre.addEventListener("input", () => {
    pPreUni.value = pPre.value;
  });
</script>
        <div>
          <label>Stock disponible</label>
          <input type="number" id="pStock">
        </div>
        
        <div class="full-width">

      <button class="btn-add" style="margin-top:20px" onclick="guardar()">GUARDAR PRODUCTO</button>

      <button class="btn-add" style="background:#fecaca; color:#7f1d1d; margin-top:10px" onclick="activarModoEliminar()">Editar o eliminar producto o imagen de galería</button>

  <div class="modal" id="modalClave">

      <input type="password" id="passInput" placeholder="Clave">
      <button class="btn-add" onclick="login()">INGRESAR</button>
    </div>
  </div>

  <div class="modal" id="modalConfirm">
    <div class="modal-content" style="max-width:400px; text-align:center">
      <h3 id="confirmTitle">Confirmar acción</h3>
      <p id="confirmMessage">¿Está seguro que desea continuar?</p>
      <button class="btn-add" id="confirmAccept">ACEPTAR</button>
      <button class="btn-add" style="background:#e5e7eb; color:#111827; margin-top:10px" id="confirmCancel">CANCELAR</button>

  <div class="modal" id="modalVariantes">
    <div class="modal-content" style="max-width:480px">
      <h3 id="varTitle">Seleccionar opciones de tu pedido</h3>
      <input type="hidden" id="varProdId">
      <div class="product-options"></div>
      <div id="varOptions" style="margin-top:15px; display:flex; flex-direction:column; gap:12px"></div>
      <button class="btn-add" style="margin-top:20px" onclick="confirmarVariantes()">CONFIRMAR Y AGREGAR</button>
      <button class="btn-add" style="background:#e5e7eb; color:#111827; margin-top:10px" onclick="cerrarModal('modalVariantes')">CANCELAR</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCuHSlv7WEmoEWh96rWWCnTi7AwgN-7Hd4",
      authDomain: "tatuajes-e7c8f.firebaseapp.com",
      databaseURL: "https://tatuajes-e7c8f-default-rtdb.firebaseio.com/",
      projectId: "tatuajes-e7c8f",
      storageBucket: "tatuajes-e7c8f.appspot.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'productos');
    const galeriaRef = ref(db, 'galeria_ferre');

    let productos = [];
    let galeria = [];
    let carrito = [];
    try {
      const stored = JSON.parse(localStorage.getItem('ferre_v2_cart') || '[]');
      if (Array.isArray(stored)) {
        carrito = stored.map(item => ({
          id: item.id,
          cantidad: typeof item.cantidad === 'number' && item.cantidad > 0 ? item.cantidad : 1,
          tamanioSeleccionado: item.tamanioSeleccionado || '',
          colorSeleccionado: item.colorSeleccionado || '',
          materialSeleccionado: item.materialSeleccionado || '',
          garantiaSeleccionada: item.garantiaSeleccionada || ''
        }));
      }
    } catch (e) {
      localStorage.removeItem('ferre_v2_cart');
      carrito = [];
    }
    let isAdmin = false;
    let filtroTexto = '';
    let filtroCategoria = 'all';
    let loaderOculto = false;
    let modoEliminar = false;
    let accionPendiente = null;

    onValue(dbRef, (snap) => {
      productos = [];
      snap.forEach(c => { productos.push({id: c.key, ...c.val()}); });
      render();
      actualizarCarritoUI();
      ocultarLoader();
    });

    onValue(galeriaRef, (snap) => {
      galeria = [];
      snap.forEach(c => { galeria.push({id: c.key, ...c.val()}); });
      renderGaleria();
      ocultarLoader();
    });

    function ocultarLoader() {
      if (loaderOculto) return;
      const loader = document.getElementById('loader');
      if (!loader) return;
      loaderOculto = true;
      setTimeout(() => { loader.style.display = 'none'; }, 1500);
    }

    window.abrirModal = (id) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.style.display = 'flex';
      if (id === 'modalProd') {
        setTimeout(() => initAdminPreviews(), 0);
      }
      if (id === 'modalCarrito') {
        setTimeout(() => {
          bindCheckoutFields();
          updateCheckoutReady();
        }, 0);
      }
    };
    window.cerrarModal = (id) => document.getElementById(id).style.display = 'none';

    window.activarModoEliminar = () => {
      modoEliminar = true;
      cerrarModal('modalProd');
      render();
      renderGaleria();
    };

    window.toggleAdminSection = (btnId, sectionId) => {
      const btn = document.getElementById(btnId);
      const sec = document.getElementById(sectionId);
      if (!btn || !sec) return;
      const openText = btn.getAttribute('data-open') || btn.innerText;
      const closeText = btn.getAttribute('data-close') || btn.innerText;
      const show = sec.style.display === 'none' || sec.style.display === '';
      if (show) {
        sec.style.display = 'block';
        btn.innerText = closeText;
        initAdminPreviews();
      } else {
        sec.style.display = 'none';
        btn.innerText = openText;
      }
    };

    window.abrirVariantes = (id) => {
      const p = productos.find(x => x.id === id);
      if (!p) return;
      const cont = document.getElementById('varOptions');
      const title = document.getElementById('varTitle');
      const hidden = document.getElementById('varProdId');
      if (!cont || !title || !hidden) return;
      hidden.value = id;
      title.innerText = p.nombre || 'Seleccionar opciones del producto';

      let blocks = '';
      const tieneKilo = typeof p.precioKilo === 'number' && p.precioKilo > 0;
      const tieneUnidad = typeof p.precioUnidad === 'number' && p.precioUnidad > 0;
      const tieneSoloBase = !tieneKilo && !tieneUnidad && (typeof p.precio === 'number' || p.precio);
      if (tieneKilo || tieneUnidad || tieneSoloBase) {
        let precioHtml = '';
        if (tieneKilo || tieneUnidad) {
          precioHtml = `
            <div>
              <div class="specs-label">Modo de compra</div>
              <div class="option-group" data-group="modo">
                ${tieneKilo ? `<button type="button" class="option-btn active" data-type="modo" data-value="kilo">Por kilo ($${p.precioKilo})</button>` : ''}
                ${tieneUnidad ? `<button type="button" class="option-btn ${!tieneKilo ? 'active' : ''}" data-type="modo" data-value="unidad">Por unidad ($${p.precioUnidad})</button>` : ''}
              </div>
            </div>
            <div>
              <div class="specs-label">Cantidad</div>
              <input id="varCantidad" type="number" min="0.1" step="${tieneKilo && !tieneUnidad ? '0.1' : '1'}" value="1" style="width:120px">
            </div>
          `;
        } else {
          precioHtml = `
            <div>
              <div class="specs-label">Precio</div>
              <div class="specs-value">$${p.precio}</div>
            </div>
            <div>
              <div class="specs-label">Cantidad</div>

    function parseOpciones(valor) {
      if (!valor) return [];
      const partes = valor.split(/[,/]/).map(v => v.trim()).filter(v => v.length);
      if (partes.length <= 1) return [];
      return partes;
    }

    function numFromFraction(txt) {
      const frac = txt.match(/(\d+)\s*\/\s*(\d+)/);
      if (frac) {
        const a = parseFloat(frac[1]); const b = parseFloat(frac[2]);
        if (b !== 0) return a / b;
      }
      return NaN;
    }

    function toNumberForField(field, sRaw) {
      if (!sRaw) return NaN;
      const s = sRaw.toLowerCase().replace(',', '.').trim();
      if (field === 'garantia') {
        const y = s.match(/(\d+(\.\d+)?)[\s-]*a(ñ|n)o/); if (y) return parseFloat(y[1]) * 12;
        const m = s.match(/(\d+(\.\d+)?)[\s-]*mes/); if (m) return parseFloat(m[1]);
      }
      if (field === 'voltaje' || field === 'potencia' || field === 'contenido') {
        let n = parseFloat(s.replace(/[^0-9.]/g, ''));
        if (!isNaN(n)) {
          if (field === 'potencia' && /kw/.test(s)) n = n * 1000;
          if (field === 'contenido') {
            if (/ml/.test(s)) n = n / 1000;
            if (/gal/.test(s)) n = n * 3.785;
          }
          return n;
        }
      }
      if (field === 'calibre') {
        const n = parseFloat(s.replace(/[^0-9.]/g, ''));
        return isNaN(n) ? NaN : n;
      }
      if (field === 'length') {
        if (/mm/.test(s)) {
          const n = parseFloat(s.replace(/[^0-9.]/g, ''));
          return isNaN(n) ? NaN : n;
        }
        if (/cm/.test(s)) {
          const n = parseFloat(s.replace(/[^0-9.]/g, ''));
          return isNaN(n) ? NaN : n * 10;
        }
        if (/("|pulg)/.test(s)) {
          let n = parseFloat(s.replace(/[^0-9.]/g, ''));
          if (isNaN(n)) n = numFromFraction(s);
          return isNaN(n) ? NaN : n * 25.4;
        }
        let n = parseFloat(s.replace(/[^0-9.]/g, ''));
        if (isNaN(n)) n = numFromFraction(s);
        return isNaN(n) ? NaN : n;
      }
      const n = parseFloat(s.replace(/[^0-9.]/g, ''));
      return isNaN(n) ? NaN : n;
    }

    function sortOptionsForInputId(inputId, arr) {
      const copy = [...arr];
      const alpha = (a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' });
      const numSort = (key) => (a, b) => {
        const na = toNumberForField(key, a); const nb = toNumberForField(key, b);
        if (isNaN(na) && isNaN(nb)) return alpha(a, b);
        if (isNaN(na)) return 1;
        if (isNaN(nb)) return -1;
        return na - nb;
      };
      switch (inputId) {
        case 'pTamanio':
        case 'pDiametro':
        case 'pLargo':
          return copy.sort(numSort('length'));
        case 'pVoltaje':
          return copy.sort(numSort('voltaje'));
        case 'pPotencia':
          return copy.sort(numSort('potencia'));
        case 'pContenido':
          return copy.sort(numSort('contenido'));
        case 'pCalibre':
          return copy.sort(numSort('calibre'));
        case 'pGarantia':
          return copy.sort(numSort('garantia'));
        default:
          return copy.sort(alpha);
      }
    }

    function sortOptionsByKey(key, arr) {
      const map = {
        tamanio: 'pTamanio',
        color: 'pColor',
        material: 'pMaterial',
        garantia: 'pGarantia',
        rosca: 'pRosca',
        cabeza: 'pCabeza',
        diametro: 'pDiametro',
        largo: 'pLargo',
        voltaje: 'pVoltaje',
        potencia: 'pPotencia',
        contenido: 'pContenido',
        calibre: 'pCalibre',
        acabado: 'pAcabado'
      };
      const id = map[key] || '';
      return id ? sortOptionsForInputId(id, arr) : arr;
    }

    function getSortedOptionsForKey(key, valueStr) {
      const arr = parseOpciones(valueStr);
      return sortOptionsByKey(key, arr);
    }

    function getOptionsFromInput(inputId) {

    function setOptionsToInput(inputId, arr) {

    window.cambiarCantidad = (index, delta) => {
      const item = carrito[index];
      const prod = productos.find(x => x.id === item.id);
      const step = item.modoPrecioSeleccionado === 'kilo' ? 0.1 : 1;
      let next = (parseFloat(item.cantidad) || 0) + delta;
      if (item.modoPrecioSeleccionado === 'kilo') {
        next = Math.round(next * 10) / 10;
        if (isNaN(next) || next < 0.1) next = 0.1;
      } else {
        next = Math.round(next);
        if (isNaN(next) || next < 1) next = 1;
      }
      // Verificar stock total permitido por producto
      if (prod && typeof prod.stock === 'number') {
        let totalSinEste = 0;
        carrito.forEach((ci, i) => {
          if (ci.id === item.id && i !== index) totalSinEste += Math.ceil(ci.cantidad);
        });
        const unidadesDeseadas = Math.ceil(next);
        if (totalSinEste + unidadesDeseadas > prod.stock) {
          alert('No hay stock suficiente para incrementar más este producto.');
          return;
        }
      }
      item.cantidad = next;
      actualizarCarritoUI();
    };

    window.borrarDelCarrito = (index) => {
      carrito.splice(index, 1);
      actualizarCarritoUI();
    };

    function lanzarEfectos() {
      const h = document.getElementById('happy-cart');
      h.classList.add('active');
      const b = document.getElementById('cartCount');
      b.classList.remove('badge-anim'); void b.offsetWidth; b.classList.add('badge-anim');
      setTimeout(() => h.classList.remove('active'), 1500);
    }

    function flyToCart(btn) {
      const cartIcon = document.getElementById('cartIconBtn');
      if(!cartIcon) return;
      const rectBtn = btn.getBoundingClientRect();
      const rectCart = cartIcon.getBoundingClientRect();
      const emoji = document.createElement('div');
      emoji.className = 'flying-cart';
      emoji.textContent = '🍎✨';
      emoji.style.left = rectBtn.left + rectBtn.width / 2 + 'px';
      emoji.style.top = rectBtn.top + rectBtn.height / 2 + 'px';
      document.body.appendChild(emoji);
      const deltaX = rectCart.left + rectCart.width / 2 - (rectBtn.left + rectBtn.width / 2);
      const deltaY = rectCart.top + rectCart.height / 2 - (rectBtn.top + rectBtn.height / 2);
      emoji.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: `translate(${deltaX}px, ${deltaY}px) scale(0.2)`, opacity: 0 }
      ], {
        duration: 700,
        easing: 'ease-in-out'
      }).onfinish = () => {
        document.body.removeChild(emoji);
      };
    }

    function actualizarCarritoUI() {
      try {
        const compactCart = carrito.map(item => ({
          id: item.id,
          cantidad: item.cantidad,
          tamanioSeleccionado: item.tamanioSeleccionado || '',
          colorSeleccionado: item.colorSeleccionado || '',
          materialSeleccionado: item.materialSeleccionado || '',
          garantiaSeleccionada: item.garantiaSeleccionada || ''
        }));
        localStorage.setItem('ferre_v2_cart', JSON.stringify(compactCart));
      } catch (e) {
        console.error('Error guardando carrito', e);
        localStorage.removeItem('ferre_v2_cart');
      }
      const list = document.getElementById('cartList');
      const count = document.getElementById('cartCount');
      const total = document.getElementById('cartTotal');
      if (!list || !count || !total) return;
      list.innerHTML = '';
      let sum = 0; let itemsCount = 0;

      carrito.forEach((item, i) => {
        const prod = productos.find(x => x.id === item.id) || {};
        let precioUnit = 0;
        if (item.modoPrecioSeleccionado === 'kilo' && typeof prod.precioKilo === 'number') precioUnit = prod.precioKilo;
        else if (item.modoPrecioSeleccionado === 'unidad' && typeof prod.precioUnidad === 'number') precioUnit = prod.precioUnidad;
        else precioUnit = typeof prod.precio === 'number' ? prod.precio : parseFloat(prod.precio) || 0;
        const subtotal = precioUnit * item.cantidad;
        sum += subtotal;
        itemsCount += Math.ceil(item.cantidad);
        const detalles = [];
        if (item.modoPrecioSeleccionado) detalles.push('🧮 ' + (item.modoPrecioSeleccionado === 'kilo' ? 'Por kilo' : 'Por unidad'));
        const detallesTexto = detalles.length ? detalles.join(' ') : '';
        list.innerHTML += `
          <div class="cart-item">
            <img src="${prod.foto || 'https://via.placeholder.com/200'}" class="cart-img-min">
            <div>
              <div style="font-weight:bold; font-size:0.9rem">${prod.nombre || ''}</div>
              ${prod.desc ? `<div style="font-size:0.75rem; color:#64748b; margin-top:2px">${prod.desc}</div>` : ''}
              <div style="font-size:0.8rem; color:#64748b">$${precioUnit} ${item.modoPrecioSeleccionado === 'kilo' ? '/kg' : 'c/u'}</div>
              ${detallesTexto ? `<div style="font-size:0.7rem; color:#94a3b8; margin-top:2px">${detallesTexto}</div>` : ''}
              <button class="btn-delete-item" onclick="borrarDelCarrito(${i})">Borrar producto</button>
            </div>
            <div style="text-align:right">
              <div class="qty-controls">
                <button class="btn-qty" onclick="cambiarCantidad(${i}, ${item.modoPrecioSeleccionado === 'kilo' ? '-0.1' : '-1'})">-</button>
                <input class="qty-input" readonly value="${item.cantidad}">
                <button class="btn-qty" onclick="cambiarCantidad(${i}, ${item.modoPrecioSeleccionado === 'kilo' ? '0.1' : '1'})">+</button>
              </div>
              <div style="font-weight:900; margin-top:5px">$${subtotal.toLocaleString()}</div>
            </div>
          </div>
          `;
      });
      count.innerText = itemsCount;
      total.innerText = '$' + sum.toLocaleString();
      updateCheckoutReady();
    }

    function bindCheckoutFields() {
      const pay = document.getElementById('payMethod');
      const name = document.getElementById('customerName');
      if (pay && !pay.dataset.bound) {
        pay.addEventListener('change', updateCheckoutReady);
        pay.dataset.bound = '1';
      }
      if (name && !name.dataset.bound) {
        name.addEventListener('input', updateCheckoutReady);
        name.dataset.bound = '1';
      }
    }

    function updateCheckoutReady() {
      const btn = document.getElementById('whatsappBtn');
      if (!btn) return;
      const pay = document.getElementById('payMethod');
      const name = document.getElementById('customerName');
      const ok = carrito.length > 0 && pay && pay.value && name && name.value.trim().length > 0;
      btn.disabled = !ok;
    }

    window.enviarWhatsApp = () => {
      if(!carrito.length) return;
      const pay = document.getElementById('payMethod');
      const name = document.getElementById('customerName');
      if (!pay || !pay.value || !name || !name.value.trim()) {
        alert('Completa la forma de pago y tu nombre antes de enviar.');
        return;
      }
      const pagoTxt = pay.value === 'transferencia' ? 'Transferencia 🔁'
                    : pay.value === 'tarjeta' ? 'Tarjeta 💳'
                    : 'Efectivo 💵';
      const copiaCarrito = carrito.map(item => ({...item}));
      const cantidadesPorProducto = {};
      copiaCarrito.forEach(item => {
        if (!cantidadesPorProducto[item.id]) cantidadesPorProducto[item.id] = 0;
        cantidadesPorProducto[item.id] += Math.ceil(item.cantidad);
      });

      Object.keys(cantidadesPorProducto).forEach(id => {
        const prod = productos.find(x => x.id === id);
        if (!prod || typeof prod.stock !== 'number') return;
        const nuevoStock = Math.max(0, prod.stock - cantidadesPorProducto[id]);
        prod.stock = nuevoStock;
        const { id: _, ...resto } = prod;
        set(ref(db, 'productos/'+id), { ...resto, stock: nuevoStock });
      });

      let msg = `🥬 *PEDIDO VERDULERÍA NORMITA*\n`;
      msg += `👤 *Cliente:* ${name.value.trim()}\n`;
      msg += `💳 *Pago:* ${pagoTxt}\n\n`;
      let total = 0;
      copiaCarrito.forEach(item => {
        const prod = productos.find(x => x.id === item.id) || {};
        let precioUnit = 0;
        if (item.modoPrecioSeleccionado === 'kilo' && typeof prod.precioKilo === 'number') precioUnit = prod.precioKilo;
        else if (item.modoPrecioSeleccionado === 'unidad' && typeof prod.precioUnidad === 'number') precioUnit = prod.precioUnidad;
        else precioUnit = typeof prod.precio === 'number' ? prod.precio : parseFloat(prod.precio) || 0;
        const subtotal = precioUnit * item.cantidad;
        const modoTxt = item.modoPrecioSeleccionado ? (item.modoPrecioSeleccionado === 'kilo' ? 'kg' : 'u') : 'u';
        msg += `📦 *${prod.nombre || ''}*\n`;
        if (prod.desc) msg += `   📝 ${prod.desc}\n`;
        msg += `   Cant: ${item.cantidad} ${modoTxt} x $${precioUnit} = *$${subtotal.toLocaleString()}*\n\n`;
        total += subtotal;
      });
      msg += `🛒 _Artículos:_ *${copiaCarrito.reduce((acc, item) => acc + Math.ceil(item.cantidad), 0)}*\n`;
      msg += `💰 *TOTAL:* $${total.toLocaleString()}\n\n`;
      msg += `✅ Gracias por tu pedido.`;

      carrito = [];
      actualizarCarritoUI();
      render();

      window.open(`https://wa.me/5491122334455?text=${encodeURIComponent(msg)}`, '_blank');
    };

    const searchInput = document.getElementById('searchInput');
    const filterButtons = document.querySelectorAll('.filter-btn');

    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        filtroTexto = e.target.value.toLowerCase();
        render();
      });
    }

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filtroCategoria = btn.dataset.cat;
        render();
      });
    });

    function filtrarProductos() {
      return productos.filter(p => {
        const coincideTexto =
          !filtroTexto ||
          (p.nombre && p.nombre.toLowerCase().includes(filtroTexto)) ||
          (p.marca && p.marca.toLowerCase().includes(filtroTexto)) ||
          (p.categoria && p.categoria.toLowerCase().includes(filtroTexto));
        const coincideCategoria =
          filtroCategoria === 'all' ||
          (p.categoria === filtroCategoria);
        return coincideTexto && coincideCategoria;
      });
    }

    function renderGaleria() {
      const cont = document.getElementById('galeriaSuperior');
      if(!cont) return;
      cont.innerHTML = '';
      galeria.forEach(g => {
        cont.innerHTML += `
          <div class="gallery-item">
            <img src="${g.url}">
            ${isAdmin ? `<button class="gallery-delete" onclick="borrarImgGaleria('${g.id}')">✕</button>` : ''}
          </div>
        `;
      });
    }

    function render() {
      const grid = document.getElementById('listaProductos');
      grid.innerHTML = '';
      const lista = filtrarProductos();
      lista.forEach(p => {
        const tieneStockNumero = typeof p.stock === 'number';
        const stockNumero = tieneStockNumero ? p.stock : null;
        const tieneKilo = typeof p.precioKilo === 'number' && p.precioKilo > 0;
        const tieneUnidad = typeof p.precioUnidad === 'number' && p.precioUnidad > 0;
        let stockHtml = '';
        let stockClase = '';
        if (tieneStockNumero) {
          if (stockNumero <= 0) stockClase = 'stock-badge-out';
          else if (stockNumero <= 5) stockClase = 'stock-badge-low';
          else stockClase = 'stock-badge-ok';
          stockHtml = `<div class="stock-badge ${stockClase}"><span class="stock-dot"></span>Stock: ${stockNumero}</div>`;
        }
        const disabledAttr = tieneStockNumero && stockNumero <= 0 ? 'disabled' : '';
        const textoBoton = tieneStockNumero && stockNumero <= 0 ? 'SIN STOCK' : 'AGREGAR AL CARRITO';
        grid.innerHTML += `
          <div class="card">
            ${isAdmin ? `<div style="position:absolute; top:10px; right:10px; display:flex; gap:5px; z-index:10">
              <button onclick="editar('${p.id}')" style="background:var(--success); color:white; border:none; padding:8px; border-radius:5px; cursor:pointer">✏️</button>
              <button onclick="borrarDB('${p.id}')" style="background:var(--danger); color:white; border:none; padding:8px; border-radius:5px; cursor:pointer">🗑️</button>
            </div>` : ''}
            ${isAdmin && modoEliminar ? `<button class="card-delete-x" onclick="borrarDB('${p.id}')">X</button>` : ''}
            <div class="card-img"><img src="${p.foto}"></div>
            <div class="card-info">
              <h3 style="margin:5px 0; font-size:1.1rem">${p.nombre}</h3>
              ${p.desc ? `<div style="font-size:0.8rem; color:#64748b; margin-bottom:8px">${p.desc}</div>` : ''}
              ${stockHtml}
              <div style="font-size:1.1rem; font-weight:900; margin-bottom:15px; display:flex; gap:8px; flex-wrap:wrap">
                ${
                  tieneKilo ? `<span style="background:#dcfce7; color:#166534; padding:6px 10px; border-radius:8px; font-weight:800">$${p.precioKilo}/kg</span>` : ''
                }
                ${
                  tieneUnidad ? `<span style="background:#e0f2fe; color:#075985; padding:6px 10px; border-radius:8px; font-weight:800">$${p.precioUnidad}/u</span>` : ''
                }
                ${
                  (!tieneKilo && !tieneUnidad && p.precio) ? `<span style="background:#f1f5f9; color:#0f172a; padding:6px 10px; border-radius:8px; font-weight:800">$${p.precio}</span>` : ''
                }
              </div>
              <button class="btn-add" ${disabledAttr} onclick="abrirVariantes('${p.id}')">
                <i class="fas fa-cart-plus"></i> ${textoBoton}
              </button>
            </div>
          </div>`;

      });

      // no hay grupos de opciones en la tarjeta; las variantes se seleccionan en la modal
    }
    

  </script>
</body>
</html>
